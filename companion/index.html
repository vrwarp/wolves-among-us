<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Footprints Companion</title>
<style>
:root{--bg:#faf9f7;--fg:#1c1a18;--mut:#6b6660;--line:#e2ded8;--card:#fff;--acc:#ff5722;
--ok:#2f7d5d;--warn:#b8860b;--bad:#c0392b;--blue:#2b5f96}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{overflow-x:hidden;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--fg);
border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
.btn-acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-ghost{background:transparent}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:22px;margin:14px 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.sect{margin:20px 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:#4a453f;text-transform:uppercase;
border-bottom:1px solid var(--line);padding-bottom:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row>button{flex:1;min-width:70px}
.grid{display:grid;gap:8px}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.small{font-size:12.5px;color:var(--mut)}
/* status strip */
.strip{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:11px;padding:10px 12px;flex-wrap:wrap}
.strip .clk{font-size:29px;font-weight:800}
.strip .cell b{font-size:17px}
.strip .cell{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;line-height:1.2}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.live{background:var(--ok)} .dot.demo{background:#999} .dot.off{background:var(--bad)}
/* the dot alone is too quiet for the one signal that matters — label it */
.conn{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;
letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;border-radius:20px;white-space:nowrap}
.connbar{padding:10px 14px;font-size:13px;line-height:1.4}
.connbar.demo{background:#2f2c29;color:#fff}
.connbar.demo b{color:#ffd9a8}
.connbar.off{background:#fbecea;color:var(--bad);border-bottom:1px solid #f0c4bd}
.conn.live{color:var(--ok);background:#e9f4ef}
.conn.demo{color:#5d5952;background:#ececea;box-shadow:inset 0 0 0 1.5px #c9c4bc}
.conn.off{color:var(--bad);background:#fbecea;box-shadow:inset 0 0 0 1.5px #f0c4bd}
.conn.only-dot{padding:5px;background:none}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.chip.meeting{background:#eaf1f9;color:var(--blue)} .chip.sabotage{background:#fbecea;color:var(--bad)}
/* tabs */
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;border-radius:20px;padding:9px}
.tabs .on{background:var(--fg);border-color:var(--fg);color:#fff}
/* answers */
.numpad{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.numpad button{padding:9px 0;border-radius:8px;font-weight:700}
.numpad .on{background:var(--acc);border-color:var(--acc);color:#fff}
.codes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.codes .cd{border:1.5px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.codes .cd b{font-size:19px;display:block}
.codes .cd span{font-size:10.5px;color:var(--mut)}
.sud{border-collapse:collapse;margin:8px auto}
.sud td{width:44px;height:44px;text-align:center;font-size:21px;font-weight:700;border:1px solid #bbb}
.sud td.gv{color:var(--acc)}
.sud tr:first-child td{border-top:2.5px solid #222}.sud tr:last-child td{border-bottom:2.5px solid #222}
.sud td:first-child{border-left:2.5px solid #222}.sud td:last-child{border-right:2.5px solid #222}
.sud tr:nth-child(2) td{border-bottom:2.2px solid #222}.sud td:nth-child(2){border-right:2.2px solid #222}
/* number pad */
.padwrap{max-width:340px;margin:0 auto}
.padread{border:2px solid var(--line);border-radius:12px;background:var(--card);text-align:center;
font-size:27px;font-weight:800;padding:5px;margin:4px 0 7px;min-height:46px}
.padread.ok{border-color:var(--acc)}
.padread .ph{color:#c9c4bc;font-size:15px;font-weight:600;line-height:2.2}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pk{font-size:21px;font-weight:700;padding:9px 0;border-radius:10px}
.pk-mut{font-size:14px;color:var(--mut)}
/* monitor */
.mon{background:#0f0f13;color:#f2f0ec;position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:2.5vh;padding:3vh 3vw;text-align:center}
.mon .mclk{font-size:min(24vw,42vh);font-weight:800;line-height:.95;letter-spacing:-.02em}
.mon .mlab{font-size:clamp(11px,2vw,26px);letter-spacing:.35em;color:#8a857e;text-transform:uppercase}
.mon.warn .mclk{color:#ffb14a}.mon.crit .mclk{color:#ff6b57}
.mstats{display:flex;flex-wrap:wrap;justify-content:center;gap:4vw 5vw;font-size:clamp(11px,2.2vw,26px);color:#c9c4bc}
.mstats b{font-size:clamp(20px,3.4vw,42px);color:#fff;display:block}
.boxes{display:flex;gap:.7vw;flex-wrap:wrap;justify-content:center;max-width:92vw}
.bx{width:4.4vw;height:4.4vw;min-width:30px;min-height:30px;border:2.5px solid #4a463f;border-radius:6px;
display:flex;align-items:center;justify-content:center;font-size:clamp(12px,1.7vw,22px);color:#6b6660;font-weight:700}
.bx.hit{background:var(--bad);border-color:var(--bad);color:#fff}
.bx.thr{border-color:#f2f0ec;border-width:3.5px;color:#f2f0ec}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:2vh;padding:3vw;text-align:center;z-index:9}
/* opaque: at 96% the giant clock behind ghosts through and fights the prop list,
   which is the one thing the room has to read */
.overlay.sab{background:#96190c;animation:pulse 1.2s infinite}
.overlay.meet{background:#123054}
.overlay.win{background:#8c140a} .overlay.crew{background:#145a3c}
@keyframes pulse{50%{background:#781006}}
.overlay h2{font-size:clamp(28px,5vw,72px);margin:0;letter-spacing:.05em;color:#fff}
.overlay .items{font-size:clamp(15px,2.7vw,34px);color:#fff;font-weight:700;line-height:1.45}
.overlay .items span{color:#ffc9b8;font-weight:600}
.overlay .pclk{font-size:clamp(44px,8vw,120px);font-weight:800;color:#fff;line-height:1}
.mbtns{position:fixed;right:12px;bottom:10px;display:flex;gap:8px;opacity:.5}
.mbtns button{background:#1d1c22;border-color:#333;color:#bbb;padding:8px 11px;font-size:12px}
/* home */
.home{display:grid;gap:10px;margin-top:10px}
.home button{padding:15px;font-size:17px;border-radius:14px;text-align:left}
.home .desc{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:2px}
.hometop{display:flex;align-items:center;gap:10px}
.hometop h1{flex:1;min-width:0}
/* five view chips never fit one 375px row — two columns keeps every label whole */
.viewpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.viewpick button{padding:11px 6px;font-size:14px;border-radius:10px}
.viewpick button:last-child{grid-column:1/-1}
textarea{width:100%;min-height:110px;font:12.5px ui-monospace,Menlo,monospace;border:1.5px solid var(--line);
border-radius:10px;padding:10px;background:var(--card);color:var(--fg)}
input[type=text]{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--card);width:100%}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
#qr img,#qr canvas{border:8px solid #fff;border-radius:6px}
.linkbox{word-break:break-all;font-size:11.5px;color:var(--mut);background:var(--card);
border:1px dashed var(--line);border-radius:8px;padding:8px;max-height:46px;overflow:auto;
-webkit-overflow-scrolling:touch}
.banner-off{background:#fbecea;color:var(--bad);font-size:13px;padding:8px 12px;border-radius:8px;margin:8px 0;display:none}
.arm{outline:3px solid var(--bad)}
.on-chip{background:var(--fg);border-color:var(--fg);color:#fff}
.btn-undo{background:#fff7ed;border-color:#f0c9a8;color:#8a4b12;font-weight:700}
.btn-step{padding:18px 14px;font-size:18px}
.btn-wide{width:100%;padding:16px;font-size:18px}
.phaserow{gap:5px}
.phaserow button{padding:9px 3px;font-size:12.5px;min-width:0;color:var(--mut);letter-spacing:-.01em}
.linkish{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--acc);
text-decoration:underline;cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv b{text-align:right}
/* long values read as ragged right-aligned mush on a phone — stack them */
.kv.stack{display:block}
.kv.stack span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.09em;
text-transform:uppercase;color:#4a453f;margin-bottom:3px}
.kv.stack b{display:block;text-align:left;font-weight:600;line-height:1.5}
</style>
</head>

  const first=await F.getDoc(ref);
  if(!first.exists())await F.setDoc(ref,JSON.parse(JSON.stringify(DEF)));   // create ONLY if missing — joining never resets a live game
  await F.setDoc(ref,{_ping:{by:myId,t:F.serverTimestamp()}},{merge:true}); // clock-offset probe, nothing else
  let gotOffset=false;
  F.onSnapshot(ref,{includeMetadataChanges:true},snap=>{
    const d=snap.data(); if(!d)return;
    if(!gotOffset&&!snap.metadata.hasPendingWrites&&d._ping&&d._ping.by===myId&&d._ping.t&&d._ping.t.toMillis){
      offset=d._ping.t.toMillis()-Date.now(); gotOffset=true;
    }
    const clean={...d}; delete clean._ping;
    S=merge(JSON.parse(JSON.stringify(DEF)),clean);
    conn=snap.metadata.fromCache?"off":"live";
    render();
  },err=>{conn="off";render()});
  return {patch(o){F.setDoc(ref,o,{merge:true}).catch(()=>{conn="off";render()})}};
}

function parseCfgText(t){
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<0)throw 0;
  let s=t.slice(a,b+1).replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,"}");
  const o=JSON.parse(s);
  if(!o.projectId||!o.apiKey)throw 0;
  return o;
}

      <div>TARGET<b>${S.targetPts} pts</b></div>
      <div>IMPOSTERS CAUGHT<b>${S.impostersCaught} / 3</b></div>
      <div>SABOTAGES<b>${S.sabotagesUsed} / 2</b></div>
    </div>
    ${overlay}
    <div class="mbtns"><button onclick="act.wake()">stay awake</button>
    <button onclick="act.fs()">fullscreen</button><button onclick="act.go('#/')">exit</button></div>
  </div>`;
}
function homeView(){
  const has=!!readCfg();
  const links=[["#/monitor","TV Monitor","big clock, death count, sabotage callouts — read-only"],
    ["#/c/cc","Central Command","all controls + answers"],
    ["#/c/foreman","Foreman","controls, answers, role crib"],
    ["#/c/referee","Roaming Referee","controls, answers, role crib"],
    ["#/c/ghost","Ghost Guide","controls, answers, role crib"]];
  let share="";
  if(has){
    const j=readCfg(); const b=cfgB64(j);
    const base=location.origin+location.pathname;
    const VIEWS=[["/monitor","TV Monitor"],["/c/cc","Central Cmd"],["/c/foreman","Foreman"],["/c/referee","Referee"],["/c/ghost","Ghost Guide"]];
    shareUrl=`${base}#${uiShare}?cfg=${b}`;
    const name=(VIEWS.find(v=>v[0]===uiShare)||VIEWS[0])[1];
    share=`<div class="sect">Share to other devices</div>
    <div class="card qrbox">
      <div class="viewpick">${VIEWS.map(([h,n])=>`<button class="${uiShare===h?"on-chip":"btn-ghost"}" onclick="act.shareView('${h}')">${n}</button>`).join("")}</div>
      <div id="qr"></div>
      <div class="row" style="width:100%">
        <button class="btn-acc" onclick="act.share()">Share ${name} link</button>
        <button id="copybtn" onclick="act.copy()">Copy link</button>
      </div>
      <div class="linkbox" id="sharelink">${shareUrl}</div>
      <div class="small">The link carries the connection and the view — the other device opens it and is in. Scan the QR or send it by AirDrop / text.</div></div>
    <div class="row"><button class="btn-ghost" onclick="act.forget()">Disconnect this device</button></div>`;
    }else{
    share=`<div class="sect">Connect (once, on this device)</div>
    <div class="card">
      <div class="small" style="margin-bottom:8px">Paste the <b>firebaseConfig</b> block from the Firebase console (SETUP.md walks through it):</div>
      <textarea id="cfgtxt" placeholder="const firebaseConfig = { apiKey: ... };"></textarea>
      <div style="margin:8px 0 4px" class="small">Game id (any word — same on every device):</div>
      <input type="text" id="gid" value="footprints-${Math.random().toString(36).slice(2,6)}">
      <div class="row"><button class="btn-acc btn-wide" onclick="act.saveCfg()">Connect</button></div>
      <div class="small" style="text-align:center;margin-top:10px">
        Just looking? <button class="linkish" onclick="act.demo()">Skip — demo mode</button><br>
        Demo mode runs on this device only. Nothing you tap is shared.</div>
    </div>`;
  }
  const roles=`<div class="sect">${has?"Open a view on this device":"Preview a view (demo only)"}</div>
  <div class="home">${links.map(([h,n,d])=>`<button onclick="act.go('${h}')">${n}<span class="desc">${d}</span></button>`).join("")}</div>`;
  app.innerHTML=`<div class="wrap">
  <div class="hometop"><h1>Footprints Companion</h1>${connHTML()}</div>
  <div class="sub">${has?`Game “${esc(readCfg().gameId)}” · every device with the link shares this state`
    :"Not connected — nothing is shared yet. Connect first, then send the QR to the other phones."}</div>
  <div class="banner-off" id="offb">Offline — showing the last known state. Changes will sync when the network returns.</div>
  ${has?roles+share:share+roles}</div>`;
  if(has)drawQR(shareUrl);
}
window.drawQR=async url=>{
  const el=document.getElementById("qr");
  if(!el)return; el.innerHTML="";
  try{
    if(!window.QRCode){await new Promise((res,rej)=>{const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
    new QRCode(el,{text:url,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
  }catch(e){el.innerHTML='<div class="small">QR unavailable — copy the link below instead.</div>'}
};
/* ---------------- render / tick ---------------- */
function render(){
  const {path}=route();
  if(path==="/monitor")monitorView();
  else if(path.startsWith("/c/")){const r=path.split("/")[2];ROLES[r]?counselorView(r):homeView()}
  else homeView();
}
setInterval(()=>{
  document.querySelectorAll("[data-clk]").forEach(e=>{const v=fmt(remOf(S.timer));if(e.textContent!==v)e.textContent=v});
  document.querySelectorAll("[data-phclk]").forEach(e=>{const v=fmt(remOf(S.phase));if(e.textContent!==v)e.textContent=v});
  const {path}=route();
  if(path==="/monitor"&&(S.deaths>=S.threshold||(S.timer.mode==="run"&&remOf(S.timer)===0)!==!!document.querySelector(".overlay.crew")))render();
},250);
window.__state=()=>JSON.parse(JSON.stringify(S));window.__conn=()=>conn;window.__offset=()=>offset;
window.addEventListener("hashchange",()=>{uiTab=null;render()});
/* ---------------- boot ---------------- */
(async()=>{
  const j=readCfg();
  const {q}=route();
  render();                                   // paint immediately; connect in the background
  if(j&&j.cfg){
    try{
      backend=await Promise.race([
        fbBackend(j.cfg,j.gameId||"footprints"),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000))
      ]);
    }catch(e){conn="off";backend=demoBackend();render()}
  }
  else backend=demoBackend();
  if(q.get("demo")==="live"){
    merge(S,{round:2,deaths:3,threshold:6,targetPts:8,impostersCaught:1,sabotagesUsed:1,
      timer:{mode:"run",endsAt:Date.now()+323000,remain:323000,dur:480000}});
    if(q.get("banner")==="sabotage")merge(S,{banner:"sabotage",sabotageSet:2,phase:{mode:"run",endsAt:Date.now()+87000,remain:87000,label:"SABOTAGE"}});
    if(q.get("banner")==="meeting")merge(S,{banner:"meeting",phase:{mode:"run",endsAt:Date.now()+150000,remain:150000,label:"NOMINATIONS"}});
    if(q.get("win")==="imp")merge(S,{deaths:6});
    S.hist=[{label:"Sabotage — set 2",s:(()=>{const o=JSON.parse(JSON.stringify(S));delete o.hist;delete o.timer.dur;o.timer={...S.timer};return {round:o.round,targetPts:o.targetPts,deaths:Math.max(0,o.deaths-0),threshold:o.threshold,impostersCaught:o.impostersCaught,sabotagesUsed:Math.max(0,o.sabotagesUsed-1),sabotageSet:0,banner:"none",timer:o.timer,phase:{mode:"idle",endsAt:0,remain:0,label:""}}})()}];
  }
  if(q.get("tab"))uiTab=q.get("tab");
  if(q.get("grp")){uiMode="grp";uiNum=q.get("grp")}
  if(q.get("sud")){uiMode="sud";uiNum=q.get("sud")}
  render();
})();
</script>
